[project]
name = "clima-varejo"
version = "0.1.0"
description = "Cruzamento de clima horário com vendas do varejo (piloto Rede TOP)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
era5 = ["cdsapi>=0.7", "xarray>=2024.1", "netCDF4>=1.6"]
dev = ["pytest>=8.0"]

[project.scripts]
clima-varejo = "clima_varejo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
clima_varejo = ["**/*.sql"]
